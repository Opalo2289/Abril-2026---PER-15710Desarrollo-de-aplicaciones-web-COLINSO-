# Tests sin servidor Eureka: evita intentos de registro en CI / mvn test.
eureka:
  client:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:vehiculos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
