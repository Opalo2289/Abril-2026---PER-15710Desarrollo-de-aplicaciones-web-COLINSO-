server:
  port: 8081

spring:
  application:
    name: vehiculos-service
  datasource:
    # VEHICULOS_* evita conflicto si en la misma shell conviven variables con operaciones-service.
    # No uses SPRING_DATASOURCE_* en .env cuando levantas los dos MS: sobreescribe el JDBC de ambos.
    url: ${VEHICULOS_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vehiculos}}
    username: ${VEHICULOS_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${VEHICULOS_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
