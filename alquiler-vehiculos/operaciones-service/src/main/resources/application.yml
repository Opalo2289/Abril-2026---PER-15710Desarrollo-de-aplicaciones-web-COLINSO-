server:
  port: 8082

spring:
  application:
    name: operaciones-service
  datasource:
    url: ${OPERACIONES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/operaciones}
    username: ${OPERACIONES_DATASOURCE_USERNAME:postgres}
    password: ${OPERACIONES_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
